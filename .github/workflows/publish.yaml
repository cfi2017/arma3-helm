name: Publish chart
on:
  push:
    branches: [main]
    paths:
      - charts/**
      - .github/workflows/publish.yaml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-chart
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs
      - run: nix develop -c bash scripts/kubeconform.sh
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Package and publish OCI chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          GH_REPOSITORY: ${{ github.repository }}
        run: nix develop -c bash scripts/publish.sh
